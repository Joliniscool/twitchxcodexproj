<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rewind Dashboard</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

      :root {
        --bg: #0e0e10;
        --bg-2: #18181b;
        --panel: rgba(24, 24, 27, 0.96);
        --surface: #1f1f23;
        --surface-alt: #121214;
        --text: #f7f7fa;
        --muted: #adadb8;
        --accent: #9147ff;
        --accent-strong: #772ce8;
        --accent-soft: rgba(145, 71, 255, 0.16);
        --success: #00d18a;
        --border: rgba(255, 255, 255, 0.08);
        --shadow: rgba(0, 0, 0, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'Inter', 'Segoe UI', sans-serif;
        background:
          radial-gradient(circle at top left, rgba(145, 71, 255, 0.2), transparent 25%),
          radial-gradient(circle at bottom right, rgba(0, 209, 138, 0.12), transparent 20%),
          linear-gradient(180deg, var(--bg), #111113 100%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        letter-spacing: -0.02em;
      }

      .panel {
        width: min(780px, calc(100vw - 32px));
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 28px 28px 24px;
        box-shadow: 0 24px 60px var(--shadow);
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), #b77cff);
        box-shadow: 0 0 22px rgba(145, 71, 255, 0.7);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 2vw, 2.2rem);
        line-height: 1.1;
        font-weight: 800;
      }

      button {
        margin-top: 4px;
        padding: 12px 18px;
        border: 1px solid rgba(145, 71, 255, 0.35);
        border-radius: 12px;
        font-weight: 700;
        font-size: 0.96rem;
        cursor: pointer;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: white;
        box-shadow: 0 12px 24px rgba(119, 44, 232, 0.35);
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.04);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 136px;
        padding: 9px 12px;
        border-radius: 999px;
        background: rgba(0, 209, 138, 0.12);
        border: 1px solid rgba(0, 209, 138, 0.26);
        color: #d7ffef;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .digest, .moments {
        margin-top: 22px;
        background: linear-gradient(180deg, rgba(31, 31, 35, 0.9), rgba(18, 18, 20, 0.9));
        border-radius: 14px;
        padding: 18px 18px 16px;
        border: 1px solid var(--border);
      }

      .digest h2, .moments h2 {
        margin: 0 0 12px;
        font-size: 1.05rem;
        letter-spacing: -0.02em;
      }

      .digest h3 {
        margin: 16px 0 8px;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      ul {
        padding-left: 18px;
        margin: 0;
        color: var(--text);
      }

      li {
        margin-bottom: 8px;
        line-height: 1.5;
      }

      .muted {
        color: var(--muted);
      }

      strong {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="toolbar">
        <h1>Rewind</h1>
        <div id="unread-badge" class="badge">Unread: 0 / 0</div>
      </div>

      <button id="trigger-button">Trigger catch-up</button>

      <div id="digest" class="digest">
        <h2>Current catch-up digest</h2>
        <p class="muted">No digest yet.</p>
      </div>

      <div id="moments" class="moments">
        <h2>Today's moments</h2>
        <p class="muted">No hype moments yet.</p>
      </div>
    </div>

    <script>
      const unreadBadge = document.getElementById('unread-badge');
      const digestEl = document.getElementById('digest');
      const momentsEl = document.getElementById('moments');
      const triggerButton = document.getElementById('trigger-button');
      const socket = new WebSocket(`ws://${location.host}`);

      function renderUnread(unread) {
        if (!unread) {
          unreadBadge.textContent = 'Unread: 0 / 0';
          return;
        }

        unreadBadge.textContent = `Unread: ${unread.questions ?? 0} Q / ${unread.events ?? 0} E`;
      }

      function renderDigest(digest) {
        if (!digest) {
          digestEl.innerHTML = '<h2>Current catch-up digest</h2><p class="muted">No digest yet.</p>';
          return;
        }

        const questionItems = (digest.questions || []).map((q) => `<li><strong>${q.user || 'viewer'}:</strong> ${q.text || ''}</li>`).join('') || '<li>None</li>';
        const eventItems = (digest.events || []).map((e) => `<li>${e.summary || 'Event'}</li>`).join('') || '<li>None</li>';
        const jokeItems = (digest.jokes || []).map((j) => `<li>${j.summary || 'Joke'}</li>`).join('') || '<li>None</li>';

        digestEl.innerHTML = `
          <h2>Current catch-up digest</h2>
          <p><strong>One line:</strong> ${digest.oneLine || 'No summary available.'}</p>
          <h3>Questions</h3>
          <ul>${questionItems}</ul>
          <h3>Events</h3>
          <ul>${eventItems}</ul>
          <h3>Jokes</h3>
          <ul>${jokeItems}</ul>
        `;
      }

      function renderMoments(list) {
        if (!list || !list.length) {
          momentsEl.innerHTML = '<h2>Today\'s moments</h2><p class="muted">No hype moments yet.</p>';
          return;
        }

        const items = list.slice(-5).reverse().map((moment) => {
          const score = moment.score ? ` (${moment.score})` : '';
          return `<li>${moment.label || 'Moment'}${score}</li>`;
        }).join('');

        momentsEl.innerHTML = `
          <h2>Today's moments</h2>
          <ul>${items}</ul>
        `;
      }

      socket.addEventListener('message', (event) => {
        const message = JSON.parse(event.data);
        if (message.type === 'unread') {
          renderUnread(message.payload);
        }
        if (message.type === 'digest') {
          renderDigest(message.payload);
        }
        if (message.type === 'moments') {
          renderMoments(message.payload);
        }
      });

      triggerButton.addEventListener('click', async () => {
        const response = await fetch('/api/trigger-catchup');
        const result = await response.json();
        if (result && result.digest) {
          renderDigest(result.digest);
        }
      });

      fetch('/api/moments')
        .then((response) => response.json())
        .then((result) => renderMoments(result.moments || []));
    </script>
  </body>
</html>
